[workspace]
members = ["cmforth", "platforms/*"]
default-members = ["cmforth"]
resolver = "2"

[workspace.dependencies]
cmforth = { path = "./cmforth" }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
embedded-test = "0.7.2"
embedded-test-linker-script = "0.1.0"
heapless = "0.9.2"
log = "0.4.29"
panic-probe = "1"
rp235x-hal = "0.4"
static_cell = "2.1.1"
thiserror = { version = "2.0.17", default-features = false }

[profile.dev]
debug = 1
codegen-units = 1
panic = "abort"
opt-level = 1

[profile.release]
debug = 1
codegen-units = 1
panic = "abort"
opt-level = 3
lto = "fat"
